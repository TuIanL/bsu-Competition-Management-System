<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1060" width="100%" style="max-width:1120px;margin:0 auto;display:block;font-family:'Segoe UI','Microsoft YaHei',sans-serif;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <style>
    .h{font-size:16px;font-weight:700;fill:#1e293b;}
    .s{font-size:12.5px;fill:#64748b;}
    .ht{font-size:16px;font-weight:700;fill:#ffffff;text-anchor:middle;dominant-baseline:central;}
    .tag{font-size:11px;font-weight:700;dominant-baseline:central;}
    .fld{font-size:12px;fill:#334155;dominant-baseline:central;font-family:'Consolas','Courier New',monospace;}
    .fld-s{font-size:10px;fill:#334155;dominant-baseline:central;font-family:'Consolas','Courier New',monospace;}
    .typ{font-size:11px;fill:#94a3b8;text-anchor:end;dominant-baseline:central;font-family:'Consolas','Courier New',monospace;}
    .pk{fill:#16a34a;}.fk{fill:#2563eb;}.uq{fill:#d97706;}.ck{fill:#d97706;}
    .ln{stroke:#94a3b8;stroke-width:1.4;fill:none;}
    .lnd{stroke:#8b5cf6;stroke-width:1.4;fill:none;stroke-dasharray:5 4;}
    .pt{font-size:11px;fill:#64748b;text-anchor:middle;dominant-baseline:central;}
    .ptp{font-size:11px;fill:#7c3aed;text-anchor:middle;dominant-baseline:central;}
    .lg{font-size:12.5px;fill:#475569;dominant-baseline:central;}
  </style>

  <!-- 标题 -->
  <text x="560" y="36" class="h" text-anchor="middle">志愿者调度系统 · ER 图</text>
  <text x="560" y="62" class="s" text-anchor="middle">7 实体 / 7 关系 · admin_user → assignment 审计线（assigned_by）</text>

  <!-- ================= 实体表 ================= -->
  <!-- event 赛事 x=80 y=120 h=130 -->
  <rect x="80" y="120" width="250" height="130" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <path d="M89,120 H321 a9,9 0 0 1 9,9 v37 H80 v-37 a9,9 0 0 1 9,-9 z" fill="#16a34a"/>
  <text x="205" y="143" class="ht">event 赛事</text>
  <line x1="80" y1="166" x2="330" y2="166" stroke="#cbd5e1"/>
  <text x="94" y="180" class="tag pk">PK</text><text x="124" y="180" class="fld">id</text><text x="318" y="180" class="typ">INTEGER</text>
  <text x="124" y="208" class="fld">name</text><text x="318" y="208" class="typ">TEXT</text>
  <text x="124" y="236" class="fld">event_date</text><text x="318" y="236" class="typ">TEXT</text>

  <!-- shift 班次 x=435 y=120 h=214 -->
  <rect x="435" y="120" width="250" height="214" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <path d="M444,120 H676 a9,9 0 0 1 9,9 v37 H435 v-37 a9,9 0 0 1 9,-9 z" fill="#16a34a"/>
  <text x="560" y="143" class="ht">shift 班次</text>
  <line x1="435" y1="166" x2="685" y2="166" stroke="#cbd5e1"/>
  <text x="449" y="180" class="tag pk">PK</text><text x="479" y="180" class="fld">id</text><text x="673" y="180" class="typ">INTEGER</text>
  <text x="449" y="208" class="tag fk">FK</text><text x="479" y="208" class="fld">event_id →event</text>
  <text x="449" y="236" class="tag fk">FK</text><text x="479" y="236" class="fld">role_id →role</text>
  <text x="479" y="264" class="fld">start_time, end_time</text>
  <text x="479" y="292" class="fld">required_count</text><text x="673" y="292" class="typ">INT</text>
  <text x="449" y="320" class="tag ck">CK</text><text x="479" y="320" class="fld">start&lt;end · count&gt;0</text>

  <!-- role 岗位 x=790 y=120 h=130 -->
  <rect x="790" y="120" width="250" height="130" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <path d="M799,120 H1031 a9,9 0 0 1 9,9 v37 H790 v-37 a9,9 0 0 1 9,-9 z" fill="#16a34a"/>
  <text x="915" y="143" class="ht">role 岗位</text>
  <line x1="790" y1="166" x2="1040" y2="166" stroke="#cbd5e1"/>
  <text x="804" y="180" class="tag pk">PK</text><text x="834" y="180" class="fld">id</text><text x="1028" y="180" class="typ">INTEGER</text>
  <text x="834" y="208" class="fld">name</text><text x="1028" y="208" class="typ">TEXT</text>
  <text x="834" y="236" class="fld">required_skill</text><text x="1028" y="236" class="typ">TEXT</text>

  <!-- application 报名 x=130 y=470 h=186 -->
  <rect x="130" y="470" width="250" height="186" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <path d="M139,470 H371 a9,9 0 0 1 9,9 v37 H130 v-37 a9,9 0 0 1 9,-9 z" fill="#16a34a"/>
  <text x="255" y="493" class="ht">application 报名</text>
  <line x1="130" y1="516" x2="380" y2="516" stroke="#cbd5e1"/>
  <text x="144" y="530" class="tag pk">PK</text><text x="174" y="530" class="fld">id</text><text x="368" y="530" class="typ">INTEGER</text>
  <text x="144" y="558" class="tag fk">FK</text><text x="174" y="558" class="fld">volunteer_id, shift_id</text>
  <text x="174" y="586" class="fld">status</text><text x="368" y="586" class="typ">TEXT</text>
  <text x="144" y="614" class="tag uq">UQ</text><text x="174" y="614" class="fld">(volunteer_id, shift_id)</text>
  <text x="144" y="642" class="tag ck">CK</text><text x="174" y="642" class="fld-s">PENDING|APPROVED|REJECTED|WITHDRAWN</text>

  <!-- volunteer 志愿者 x=435 y=470 h=186 -->
  <rect x="435" y="470" width="250" height="186" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <path d="M444,470 H676 a9,9 0 0 1 9,9 v37 H435 v-37 a9,9 0 0 1 9,-9 z" fill="#16a34a"/>
  <text x="560" y="493" class="ht">volunteer 志愿者</text>
  <line x1="435" y1="516" x2="685" y2="516" stroke="#cbd5e1"/>
  <text x="449" y="530" class="tag pk">PK</text><text x="479" y="530" class="fld">id</text><text x="673" y="530" class="typ">INTEGER</text>
  <text x="449" y="558" class="tag uq">UQ</text><text x="479" y="558" class="fld">student_no</text><text x="673" y="558" class="typ">TEXT</text>
  <text x="479" y="586" class="fld">name, status</text>
  <text x="479" y="614" class="fld">password_hash</text><text x="673" y="614" class="typ">TEXT</text>
  <text x="449" y="642" class="tag ck">CK</text><text x="479" y="642" class="fld">status: ACTIVE|INACTIVE</text>

  <!-- assignment 调度 x=740 y=470 h=270 -->
  <rect x="740" y="470" width="250" height="270" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <path d="M749,470 H981 a9,9 0 0 1 9,9 v37 H740 v-37 a9,9 0 0 1 9,-9 z" fill="#16a34a"/>
  <text x="865" y="493" class="ht">assignment 调度</text>
  <line x1="740" y1="516" x2="990" y2="516" stroke="#cbd5e1"/>
  <text x="754" y="530" class="tag pk">PK</text><text x="784" y="530" class="fld">id</text><text x="978" y="530" class="typ">INTEGER</text>
  <text x="754" y="558" class="tag fk">FK</text><text x="784" y="558" class="fld">shift_id, volunteer_id</text>
  <text x="754" y="586" class="tag fk">FK</text><text x="784" y="586" class="fld">assigned_by →admin</text>
  <text x="784" y="614" class="fld">status</text><text x="978" y="614" class="typ">TEXT</text>
  <text x="784" y="642" class="fld">check_in_at, check_out_at</text>
  <text x="754" y="670" class="tag uq">UQ</text><text x="784" y="670" class="fld">(shift_id, volunteer_id)</text>
  <text x="754" y="698" class="tag ck">CK</text><text x="784" y="698" class="fld">out≥in · COMPLETED 需时间</text>
  <text x="754" y="726" class="tag ck">CK</text><text x="784" y="726" class="fld-s">status: ASSIGNED|COMPLETED|CANCELLED</text>

  <!-- admin_user 管理员 x=740 y=850 h=130 -->
  <rect x="740" y="850" width="250" height="130" rx="9" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.6"/>
  <path d="M749,850 H981 a9,9 0 0 1 9,9 v37 H740 v-37 a9,9 0 0 1 9,-9 z" fill="#8b5cf6"/>
  <text x="865" y="873" class="ht">admin_user 管理员</text>
  <line x1="740" y1="896" x2="990" y2="896" stroke="#ddd6fe"/>
  <text x="754" y="910" class="tag pk">PK</text><text x="784" y="910" class="fld">id</text><text x="978" y="910" class="typ">INTEGER</text>
  <text x="784" y="938" class="fld">username</text><text x="978" y="938" class="typ">TEXT</text>
  <text x="784" y="966" class="fld">password_hash</text><text x="978" y="966" class="typ">TEXT</text>

  <!-- ================= 关系连线 ================= -->
  <line x1="330" y1="160" x2="435" y2="160" class="ln" marker-end="url(#arr)"/>
  <line x1="790" y1="160" x2="685" y2="160" class="ln" marker-end="url(#arr)"/>
  <line x1="455" y1="334" x2="255" y2="470" class="ln" marker-end="url(#arr)"/>
  <line x1="665" y1="334" x2="865" y2="470" class="ln" marker-end="url(#arr)"/>
  <line x1="435" y1="560" x2="380" y2="560" class="ln" marker-end="url(#arr)"/>
  <line x1="685" y1="560" x2="740" y2="560" class="ln" marker-end="url(#arr)"/>
  <line x1="865" y1="850" x2="865" y2="740" class="lnd" marker-end="url(#arrp)"/>

  <!-- ================= 关系标签 ================= -->
  <g>
    <rect x="342" y="149" width="80" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="382" y="160" class="pt">1:N 包含</text>
    <rect x="697" y="149" width="80" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="737" y="160" class="pt">1:N 岗位</text>
    <rect x="315" y="391" width="80" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="355" y="402" class="pt">1:N 收到</text>
    <rect x="725" y="391" width="80" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="765" y="402" class="pt">1:N 排班</text>
    <rect x="367" y="549" width="80" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="407" y="560" class="pt">1:N 报名</text>
    <rect x="672" y="549" width="80" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="712" y="560" class="pt">1:N 排班</text>
    <rect x="825" y="784" width="80" height="22" rx="11" fill="#faf5ff" stroke="#8b5cf6"/>
    <text x="865" y="795" class="ptp">1:N 调度</text>
  </g>

  <!-- ================= 图例 ================= -->
  <circle cx="86" cy="1024" r="6" fill="#16a34a"/>
  <text x="100" y="1024" class="lg">业务表头</text>
  <circle cx="216" cy="1024" r="6" fill="#8b5cf6"/>
  <text x="230" y="1024" class="lg">管理员表/审计线</text>
  <circle cx="396" cy="1024" r="6" fill="#16a34a"/>
  <text x="410" y="1024" class="lg">PK</text>
  <circle cx="456" cy="1024" r="6" fill="#2563eb"/>
  <text x="470" y="1024" class="lg">FK</text>
  <circle cx="516" cy="1024" r="6" fill="#d97706"/>
  <text x="530" y="1024" class="lg">UQ/CK</text>
  <line x1="626" y1="1024" x2="654" y2="1024" class="ln" marker-end="url(#arr)"/>
  <text x="664" y="1024" class="lg">1:N</text>
</svg>
